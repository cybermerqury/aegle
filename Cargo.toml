[workspace]
resolver = "3"

members = [
    "app",
    "benchmark",
    "core",
    "emulator",
    "error-correction-binary-ldpc",
    "error-correction-cascade",
    "error-correction-nonbinary-ldpc",
    "error-correction-simcommsys",
]

default-members = [
    "app",
    "emulator"
]

[workspace.dependencies]
bincode = { version = "1.3.3" }
bitvec = { version = "1.0.1", features = ["serde", "std"] }
clap = { version = "4.5.4", features = ["derive", "wrap_help"] }
core = { path = "core/"}
duration-str = { version = "0.9.1" }
ndarray = { version = "0.16.1" }
p12-keystore = { version = "=0.1.2" }
quinn = { version = "0.11.11", features = ["rustls"] }
quinn-proto = { version = "0.11.16", features = ["rustls"] }
rand = { version = "0.8.5" }
rayon = { version = "1.10.0" }
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
rustls = { version = "0.23.0" }
rustls-pemfile = { version = "2.0.0" }
serde = { version = "1.0.198", features = ["derive"] }
serde_json = "1.0.151"
statrs = { version = "0.16.0" }
tempfile = { version = "3.15.0" }
tokio = { version = "1.37.0", features = ["full", "tracing"] }
tokio-util = { version = "0.7.8" }
toml = { version = "0.8.19" }
tracing = { version = "0.1.40" }
tracing-appender = { version = "0.2.3" }
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json"] }
ureq = { version = "3.3.0", features = ["json"] }
uuid = { version = "1.8.0", features = ["v4", "serde"] }
