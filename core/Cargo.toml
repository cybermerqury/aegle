[package]
name = "core"
version = "1.0.0"
edition = "2021"

[dependencies]
bitvec = { version = "1.0.1", features = ["serde", "std"] }
rand = "0.8.5"
serde = { version = "1.0.198", features = ["derive"] }
uuid = { version = "1.8.0", features = ["v4", "serde"] }
rustls = { version = "0.23.0" }
rustls-pemfile = "2.0.0"
tracing = { version = "0.1.37" }
tokio = { version = "1.28.1", features = ["full", "tracing"] }
tokio-util = "0.7.8"
toml = { version = "0.8.19"}
